[package]
name = "telvax_runtime"
description = "Telvax: telvax_runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["tables", "live"]
# Run tensor operations on the GPU (Metal, Vulkan or DirectX through wgpu).
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
# Arrow tables with CSV / Parquet ingestion and SQL (DataFusion). Off for the Wasm playground.
# Real Ollama / OpenAI / pgvector backends (`telvax serve --live`).
live = ["dep:ureq", "dep:postgres"]
# `arrow/ipc_compression` reads Feather files compressed with LZ4 or Zstd (what PyArrow writes).
# Arrow Flight client (`std.table.read_flight`, `write_flight`). Off by default: it adds gRPC (tonic).
flight = ["dep:arrow-flight", "dep:tonic", "dep:futures", "dep:tokio"]
tables = ["dep:datafusion", "dep:tokio", "dep:parquet", "arrow/ipc_compression"]

[dependencies]
arrow = { version = "59", default-features = false, features = ["csv", "ipc"] }
bytes = "1"
memmap2 = "0.9"
datafusion = { version = "55.2.0", default-features = false, features = ["parquet", "sql", "math_expressions", "string_expressions", "datetime_expressions"], optional = true }
parquet = { version = "59", default-features = false, features = ["arrow"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
arrow-flight = { version = "59", default-features = false, features = ["tls-ring", "tls-webpki-roots"], optional = true }
tonic = { version = "0.14", features = ["tls-ring", "tls-webpki-roots"], optional = true }
futures = { version = "0.3", default-features = false, features = ["std"], optional = true }
telvax_hir = { path = "../compiler/semantic" }
chrono = { version = "0.4", default-features = false }
serde_json = "1.0.154"
smallvec = "1"
ureq = { version = "3", features = ["json"], optional = true }
postgres = { version = "0.19", features = ["with-serde_json-1"], optional = true }
stacker = "0.1.25"
unicode-normalization = "0.1"
regex = { version = "1.13", default-features = false, features = ["std", "unicode", "perf"] }
wgpu = { version = "30", default-features = false, features = ["wgsl", "metal", "vulkan-portability"], optional = true }
pollster = { version = "1.0.1", optional = true }
bytemuck = { version = "1.25.2", optional = true }

[dev-dependencies]
telvax_parser = { path = "../compiler/parser" }

# The browser has no random source of its own that this crate can reach, so the playground does without.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.4"
