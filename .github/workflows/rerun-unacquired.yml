name: Rerun jobs that got no runner

# A job of the release that waits too long for a runner (the macOS ones, mostly) is cancelled by GitHub with
# "The job was not acquired by Runner of type hosted even after multiple attempts", and because `publish` needs
# every build, the release does not happen (#230). That is transient: this runs the failed jobs of the run again,
# once. Only the first attempt is retried, and only when a job has that annotation, so a real failure, or a run
# that a person cancelled, stops as it did.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  actions: write
  checks: read
  contents: read

jobs:
  rerun:
    if: >-
      github.event.workflow_run.run_attempt == 1 &&
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the jobs again if no runner took them
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
        run: |
          stuck=$(scripts/unacquired-jobs.sh "$REPO" "$RUN" 1)
          if [ -z "$stuck" ]; then
            echo "No job of run $RUN lacked a runner: nothing to do."
            exit 0
          fi
          echo "Jobs that got no runner: $(echo $stuck)"
          gh run rerun "$RUN" --failed -R "$REPO"
