name: Release

# main is released once a week (Monday, 07:00 UTC, 04:00 in Brasília), not on every merge, unless what was merged since
# the latest tag is only documentation, CI, tests, style or chore, or changed no file that goes in a
# binary (the site, the docs, the workflows, the editor extension: scripts/release-paths.sh).
# To release sooner, run this workflow by hand (Actions, Release, Run workflow). The pull request
# titles (Conventional Commits) of everything since the latest tag pick the version, see
# scripts/next-version.sh: `feat!:` is major, `feat:` minor, `fix:` and the rest patch. To choose a version yourself, raise `version` in the root
# Cargo.toml above the latest tag. Put `[skip release]` in the title to merge without releasing.
# Pushing a `v*` tag by hand (or running the workflow) releases that tag.
on:
  schedule:
    - cron: "0 7 * * 1"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      publish: ${{ steps.tag.outputs.publish }}
      latest: ${{ steps.latest.outputs.latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The newest release before this run, for the documentation refresh of a week with nothing to release.
      - id: latest
        run: echo "latest=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n 1)" >> "$GITHUB_OUTPUT"
      - id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$(git tag --points-at HEAD)" ]; then
            echo "this commit is already tagged, nothing to release"
            echo "tag=none" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          declared="$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml | head -n 1)"
          [ -n "$declared" ] || { echo "no workspace version found" >&2; exit 1; }
          latest="$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n 1)"
          # Every commit since the latest tag counts, not only the head: a run that was cancelled while
          # it waited (see the concurrency above) leaves its commits to the next one.
          if [ -n "$latest" ]; then
            messages="$(git log "$latest..HEAD" --format='%B%x1e')"
          else
            messages="$(git log -n 1 --format='%B%x1e')"
          fi
          version="$(scripts/next-version.sh "${latest#v}" "$declared" "$messages")"
          if [ "$version" = none ]; then
            echo "this change is not released (documentation, CI, tests, style or chore, or [skip release])"
            echo "tag=none" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A release with the same binaries is not a release: if nothing that goes in a binary changed
          # since the latest tag (only the site, the docs, the workflows, the extension...), there is
          # nothing to ship. The list of paths is scripts/release-paths.sh. Raising `version` in
          # Cargo.toml counts as a change, so a version chosen by hand is still released.
          if [ -n "$latest" ] && [ "$(git diff --name-only "$latest..HEAD" | scripts/release-paths.sh)" = no ]; then
            echo "nothing that goes in a binary changed since $latest (see scripts/release-paths.sh), nothing to release"
            echo "tag=none" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="v$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Telvax $version"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          # Not exercised on a real Windows machine yet: a failure here must not block the release.
          - { os: windows-latest, target: x86_64-pc-windows-msvc, experimental: true }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Build with the release version
        run: scripts/set-version.sh "${TAG#v}"
        env:
          TAG: ${{ needs.plan.outputs.tag }}
      # Full build: SQL (DataFusion), Parquet and real services (about 50 MB).
      - run: cargo build --profile dist --locked -p telvax_cli -p telvax_pkg
      # Lite build: no DataFusion or Parquet, so no SQL; tables, CSV and real services stay (about 10 MB).
      - run: >
          cargo build --release --locked -p telvax_cli --no-default-features --features live
          --target-dir target/lite
      - name: Package
        run: |
          mkdir dist-full dist-lite
          ext=""; if [ "${{ runner.os }}" = Windows ]; then ext=".exe"; fi
          cp target/dist/telvax$ext target/dist/tvpm$ext dist-full/
          cp target/lite/release/telvax$ext target/dist/tvpm$ext dist-lite/
          for variant in full lite; do
            name=telvax-${{ matrix.target }}
            [ $variant = lite ] && name=telvax-lite-${{ matrix.target }}
            if [ "${{ runner.os }}" = Windows ]; then
              (cd dist-$variant && 7z a -tzip ../$name.zip telvax.exe tvpm.exe)
              sha256sum $name.zip > $name.zip.sha256
            else
              tar -czf $name.tar.gz -C dist-$variant telvax tvpm
              shasum -a 256 $name.tar.gz > $name.tar.gz.sha256
            fi
          done
      - uses: actions/upload-artifact@v7
        with:
          name: telvax-${{ matrix.target }}
          path: |
            telvax-*${{ matrix.target }}.tar.gz*
            telvax-*${{ matrix.target }}.zip*

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release notes
        # The CHANGELOG section for this version, when there is one; GitHub adds the list of merged
        # pull requests below it.
        run: |
          version="${{ needs.plan.outputs.tag }}"
          version="${version#v}"
          awk -v v="$version" '$0 ~ "^## "v"( |$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          files: dist/*
          body_path: notes.md
          generate_release_notes: true
          prerelease: true

  # Installs the release that was just published with the install scripts, on every system we ship
  # for, and runs the binaries: a smoke test of what users will actually download.
  verify:
    needs: [plan, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, variant: full }
          - { os: ubuntu-latest, variant: lite }
          - { os: ubuntu-24.04-arm, variant: full }
          - { os: macos-latest, variant: full }
          - { os: macos-latest, variant: lite }
          - { os: macos-15-intel, variant: full }
          - { os: windows-latest, variant: full }
          - { os: windows-latest, variant: lite }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - name: Install with the script
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          version="${TAG#v}"
          export TELVAX_HOME="$RUNNER_TEMP/telvax-home"
          [ "${{ matrix.variant }}" = lite ] && export TELVAX_LITE=1
          if [ "${{ runner.os }}" = Windows ]; then
            TELVAX_VERSION="$version" powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1
          else
            sh scripts/install.sh "$version"
          fi
          echo "$TELVAX_HOME/bin" >> "$GITHUB_PATH"
      - name: Version
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          out="$(telvax --version)"
          echo "$out"
          [ "$out" = "telvax ${TAG#v}" ]
          tvpm --help | head -n 3
      - name: Check, run and format
        run: |
          telvax check examples/rag-service.tvx
          telvax run examples/basics/primes.tvx main
          telvax fmt --check examples/basics/primes.tvx
          telvax lint examples/basics/primes.tvx
      - name: Serve the RAG example
        run: |
          telvax serve examples/rag-service.tvx --port 18080 > serve.log 2>&1 &
          pid=$!
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS -XPOST localhost:18080/v1/rag/query -H 'content-type: application/json' \
                 -d '{"query":"hello","top_k":3}' > reply.json 2>/dev/null; then ok=yes; break; fi
            sleep 1
          done
          kill $pid || true
          cat reply.json || true
          [ -n "$ok" ] || { cat serve.log; exit 1; }
          grep -q '"answer"' reply.json
      - name: Tables and CSV work everywhere; SQL and Parquet only in the full build
        run: |
          cat > tables.tvx <<'NV'
          type Row:
              id: Int
              score: f32

          fn count() -> u64:
              let t: Table[Row] = std.table.from_rows([Row(id: 1, score: 0.5)])
              t.len()

          fn query() -> u64:
              let t: Table[Row] = std.table.from_rows([Row(id: 1, score: 0.5)])
              let u: Table[Row] = t.sql("SELECT * FROM t")
              u.len()
          NV
          [ "$(telvax run tables.tvx count)" = 1 ]
          if [ "${{ matrix.variant }}" = full ]; then
            [ "$(telvax run tables.tvx query)" = 1 ]
          else
            ! telvax run tables.tvx query 2> err.txt
            grep -q "not available in this build" err.txt
          fi

  # Packages the VS Code extension at the release version, attaches the .vsix to the release and,
  # when the tokens exist, publishes it to the Visual Studio Marketplace and Open VSX.
  # Without VSCE_PAT / OVSX_PAT those two steps are skipped, so the job also works before the
  # publisher accounts are set up.
  vscode:
    needs: [plan, publish]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - name: Use the release version
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version
      - run: npm run compile
      - run: npm test
      - name: Package
        run: npx vsce package -o "telvax-${TAG#v}.vsix"
      - name: Attach to the release
        run: gh release upload "$TAG" "telvax-${TAG#v}.vsix" --clobber --repo "$GITHUB_REPOSITORY"
      - name: Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        run: npx vsce publish --packagePath "telvax-${TAG#v}.vsix" --pat "$VSCE_PAT"
      - name: Open VSX
        if: env.OVSX_PAT != ''
        run: npx ovsx publish "telvax-${TAG#v}.vsix" --pat "$OVSX_PAT"

  # The documentation of this series: /telvax/0.30/ for v0.30.1. It is in its own workflow (site.yml).
  # It only needs the tag, so it starts with the builds and does not wait for the slowest one. The folder
  # of the series is rewritten by every release: if a build fails later, the folder has the documentation
  # of a tag whose binaries did not come out, and the next release replaces it.
  site:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    uses: ./.github/workflows/site.yml
    with:
      ref: ${{ needs.plan.outputs.tag }}
    permissions:
      contents: write

  # A week with nothing to release (see `plan`) still publishes the documentation of the latest series again, so
  # the translations merged in their own repositories reach /telvax/<series>/ on the weekly schedule and not only
  # with the next release that has a binary. It builds the tag that is already released: the English pages are the
  # same, and only the translations and the pages that the tag's site knows are new.
  site-refresh:
    needs: plan
    if: github.event_name == 'schedule' && needs.plan.outputs.publish != 'true' && needs.plan.outputs.latest != ''
    uses: ./.github/workflows/site.yml
    with:
      ref: ${{ needs.plan.outputs.latest }}
    permissions:
      contents: write

  # Publishes the image ghcr.io/telvax/telvax for linux/amd64 and linux/arm64, tagged with the
  # version and `latest`. Each architecture is built on its own runner and pushed by digest; the
  # next job joins them. The first push creates the package as private: make it public once in the
  # organization's package settings. The images are built beside the binaries and only pushed by digest
  # (nobody can pull them without the digest); `image-manifest` gives them the version and `latest` after
  # the release is published.
  image:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux/amd64, suffix: amd64 }
          - { os: ubuntu-24.04-arm, platform: linux/arm64, suffix: arm64 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - name: Build with the release version
        run: scripts/set-version.sh "${TAG#v}"
        env:
          TAG: ${{ needs.plan.outputs.tag }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/telvax/telvax,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.suffix }}
          cache-to: type=gha,scope=image-${{ matrix.suffix }},mode=max
      - run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.suffix }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  image-manifest:
    needs: [plan, publish, image]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the multi-architecture image
        working-directory: ${{ runner.temp }}/digests
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          version="${TAG#v}"
          docker buildx imagetools create \
            -t "ghcr.io/telvax/telvax:$version" -t ghcr.io/telvax/telvax:latest \
            $(printf 'ghcr.io/telvax/telvax@sha256:%s ' *)
      - name: Run the published image
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          out="$(docker run --rm "ghcr.io/telvax/telvax:${TAG#v}" --version)"
          echo "$out"
          [ "$out" = "telvax ${TAG#v}" ]

  # Where the time of this run went: the queue and run time of each job, the total, the critical
  # path and the change against the previous successful release run, in the job summary, and the
  # same numbers as the artifact release-timing.json (scripts/release-timing.py). It only reads the
  # run, so a failure here never fails the release.
  timing:
    needs: [plan, build, publish, verify, vscode, site, image, image-manifest]
    if: always() && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Measure
        run: |
          jobs_of() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$1/jobs?per_page=100" --jq '.jobs[]' | jq -s '{jobs: .}'
          }
          jobs_of "$GITHUB_RUN_ID" > jobs.json
          # The latest earlier run that built binaries (a run with nothing to release is not a baseline).
          previous=""
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?status=success&per_page=10" --jq '.workflow_runs[].id'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            jobs_of "$id" > previous.json
            if jq -e '[.jobs[] | select(.name | startswith("build"))] | length > 0' previous.json > /dev/null; then
              previous="$id"
              break
            fi
          done
          args=(--workflow .github/workflows/release.yml --jobs jobs.json --out-json release-timing.json --out-md "$GITHUB_STEP_SUMMARY")
          if [ -n "$previous" ]; then args+=(--previous previous.json --previous-id "$previous"); fi
          python3 scripts/release-timing.py "${args[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-timing
          path: release-timing.json

  # Nobody watches the weekly run at 04:00 in Brasília. When a job of it fails, this opens an issue (or comments
  # on the one that is open), and GitHub tells the people who watch the repository. The experimental Windows
  # build has `continue-on-error`, so it does not count as a failure here.
  notify-failure:
    needs: [plan, build, publish, verify, vscode, site, site-refresh, image, image-manifest]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - name: Open or update the issue
        run: |
          failed="$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result == "failure") | "* `" + .key + "`"')"
          body="The Release workflow failed: ${RUN_URL}

          Jobs that failed:

          ${failed}"
          gh label create release-failure --color B60205 --description "A run of the Release workflow failed" 2>/dev/null || true
          open="$(gh issue list --label release-failure --state open --json number --jq '.[0].number // empty')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "The release failed" --label release-failure --body "$body"
          fi
